<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW JOKER | SMS BOMBER</title>
    <style>
        :root {
            --neon: #00f2ff;
            --neon-bg: rgba(0, 242, 255, 0.1);
            --success: #00ff88;
            --fail: #ff4444;
            --bg: #050508;
            --card: rgba(15, 15, 25, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.05) 0%, transparent 20%);
        }

        .main-container { width: 100%; max-width: 600px; }

        /* Header Area */
        .header { text-align: center; margin-bottom: 30px; animation: fadeIn 1s ease; }
        .header h1 { 
            font-size: 2.2rem; color: var(--neon); text-transform: uppercase; 
            letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); 
        }
        .header p { color: #666; font-size: 0.9rem; margin-top: 5px; }

        /* Input Card */
        .glass-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .input-group { position: relative; margin-bottom: 20px; }
        input {
            width: 100%; padding: 15px 20px; background: rgba(0,0,0,0.3);
            border: 1px solid #333; border-radius: 12px; color: var(--neon);
            font-size: 1.1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--neon); box-shadow: 0 0 15px var(--neon-bg); }

        .blast-btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: var(--neon); color: #000; font-weight: 800;
            font-size: 1rem; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .blast-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px var(--neon); }
        .blast-btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }

        /* API Grid / Processing Area */
        .api-list {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            margin-top: 20px; display: none; /* Initially Hidden */
        }
        .api-item {
            background: rgba(255,255,255,0.03); padding: 10px 15px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; transition: 0.3s;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        
        /* Animations */
        .loading .status-dot { background: var(--neon); animation: pulse 1s infinite; }
        .success .status-dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .fail .status-dot { background: var(--fail); box-shadow: 0 0 8px var(--fail); }
        
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Stats Bar */
        .stats-bar {
            display: flex; justify-content: space-between; margin-bottom: 15px;
            font-size: 0.85rem; color: #aaa; display: none;
        }
        .stat-val { color: var(--neon); font-weight: bold; }

        /* Footer */
        .footer { text-align: center; margin-top: 30px; font-size: 0.75rem; color: #444; }
        .shadow-text { color: var(--neon); opacity: 0.7; font-weight: bold; }

        @media (max-width: 480px) { .api-list { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h1>Shadow Joker</h1>
        <p>Advanced Security Testing Interface</p>
    </div>

    <div class="glass-card">
        <div class="input-group">
            <input type="text" id="phoneNumber" placeholder="Enter Target Number (01xxx...)" maxlength="11">
        </div>
        <button class="blast-btn" id="startBtn" onclick="initiateBlast()">🔥 Launch System</button>
    </div>

    <div class="stats-bar" id="statsBar">
        <div>Success: <span class="stat-val" id="countSuccess">0</span></div>
        <div>Failed: <span class="stat-val" id="countFail">0</span></div>
        <div>Time: <span class="stat-val" id="totalTime">0s</span></div>
    </div>

    <div class="api-list" id="apiGrid">
        </div>

    <div class="footer">
        POWERED BY <span class="shadow-text">CYBER TEAM HELP 2026</span> <br>
        DEVELOPED BY <span class="shadow-text">MEHEBUB HASAN (SHADOW JOKER)</span>
    </div>
</div>

<script>
    const apiNames = [
        "GP-Web", "Coke-Studio", "Osud-Potro", "Rabbit-Hole", "Airtel-Login",
        "Swap-BD", "Rokomari", "Paragon-Food", "eCourier", "Fundesh",
        "Bikroy", "Eon-Bazar", "Prothom-Alo", "Hoichoi-TV", "Airtel-Reg",
        "Paperfly", "Sundarban", "Cricbuzz", "GP-OTP-v2", "Swap-v2"
    ];

    function createApiGrid() {
        const grid = document.getElementById('apiGrid');
        grid.innerHTML = '';
        apiNames.forEach((name, index) => {
            grid.innerHTML += `
                <div class="api-item" id="api-${index}">
                    <span>${name}</span>
                    <div class="status-dot"></div>
                </div>
            `;
        });
    }

    async function initiateBlast() {
        const phone = document.getElementById('phoneNumber').value;
        const btn = document.getElementById('startBtn');
        const grid = document.getElementById('apiGrid');
        const stats = document.getElementById('statsBar');
        
        if (phone.length < 11) {
            alert("Please enter a valid 11-digit number!");
            return;
        }

        // Reset UI
        btn.disabled = true;
        btn.innerText = "⚡ SYSTEM ACTIVE";
        grid.style.display = "grid";
        stats.style.display = "flex";
        createApiGrid();

        // Mark all as loading
        apiNames.forEach((_, i) => document.getElementById(`api-${i}`).className = 'api-item loading');

        try {
            const response = await fetch(`/api/index?phone=${phone}`);
            const data = await response.json();

            // Simulate live processing for visual effect
            let successFound = 0;
            let failFound = 0;

            for(let i=0; i < apiNames.length; i++) {
                await new Promise(res => setTimeout(res, 100)); // Smooth delay
                const isSuccess = i < data.successful; // Mocking visual mapping
                
                const element = document.getElementById(`api-${i}`);
                if(isSuccess) {
                    element.className = 'api-item success';
                    successFound++;
                } else {
                    element.className = 'api-item fail';
                    failFound++;
                }
                
                document.getElementById('countSuccess').innerText = successFound;
                document.getElementById('countFail').innerText = apiNames.length - successFound;
            }

            document.getElementById('totalTime').innerText = data.time_seconds + "s";
            btn.innerText = "🚀 BLAST COMPLETED";
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "🔥 Launch System";
            }, 3000);

        } catch (error) {
            alert("System Error: API Not Responding");
            btn.disabled = false;
            btn.innerText = "🔥 Launch System";
        }
    }
</script>

</body>
</html>
